services:
  - type: web
    name: upi-mule-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: LOG_LEVEL
        value: INFO
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000

  - type: web
    name: upi-mule-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: VITE_API_BASE_URL
        value: https://upi-mule-backend.onrender.com
      - key: NODE_ENV
        value: production
